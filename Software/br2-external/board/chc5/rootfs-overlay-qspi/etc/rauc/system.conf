[system]
compatible=chc5
bootloader=uboot
boot-attempts=3
mountprefix=/run/rauc
data-directory=/var/lib/rauc

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/mtd6
type=nor
bootname=A

[slot.kernel.0]
device=/dev/mtd3
type=nor
parent=rootfs.0

[slot.rootfs.1]
device=/dev/mtd7
type=nor
bootname=B

[slot.kernel.1]
device=/dev/mtd4
type=nor
parent=rootfs.1

[slot.boot.0]
device=/dev/mtd0
type=nor
