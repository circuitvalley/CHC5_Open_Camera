[system]
compatible=chc5
bootloader=uboot
mountprefix=/run/rauc
boot-attempts=3
data-directory=/var/lib/rauc

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/dev/mmcblk0p6
type=raw
bootname=A

[slot.kernel.0]
device=/dev/mmcblk0p2
type=raw
parent=rootfs.0

[slot.rootfs.1]
device=/dev/mmcblk0p7
type=raw
bootname=B

[slot.kernel.1]
device=/dev/mmcblk0p3
type=raw
parent=rootfs.1

[slot.boot.0]
device=/dev/mmcblk0p1
type=raw
allow-mounted=true
